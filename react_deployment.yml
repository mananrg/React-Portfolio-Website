apiVersion: apps/v1
kind: Deployment
metadata:
  name: react-portfolio-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: react-portfolio
  template:
    metadata:
      labels:
        app: react-portfolio
    spec:
      containers:
        - name: react-portfolio
          image: mananrg291997/react-portfolio-website:v2 
          ports:
            - containerPort: 80
