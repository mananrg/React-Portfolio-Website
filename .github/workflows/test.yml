name: Portfolio Project 
on: push
jobs:
  prejobs:
    runs-on: ubuntu-latest
    steps:
      - name: Get Code
        uses: actions/checkout@v3
      - name: Install NodeJS
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install Dependencies
        run: npm install
      - name: Build Project
        run: CI=false npm run build
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: echo "Deploying to production"
